<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    
    <!-- Drop shadow filter -->
    <filter id="dropshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Logo Icon -->
  <g transform="translate(5, 5)">
    <!-- Main circle with gradient -->
    <circle cx="25" cy="25" r="20" fill="url(#logoGradient)" filter="url(#dropshadow)"/>
    
    <!-- Letter P design -->
    <g transform="translate(25, 25)">
      <!-- P letter in modern geometric style -->
      <path d="M-8 -12 L-8 12 M-8 -12 L2 -12 Q8 -12 8 -6 Q8 0 2 0 L-8 0" 
            stroke="white" 
            stroke-width="2.5" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            fill="none"/>
      
      <!-- Dot accent -->
      <circle cx="10" cy="-9" r="1.5" fill="white"/>
    </g>
    
    <!-- Decorative elements -->
    <circle cx="42" cy="15" r="2" fill="url(#logoGradient)" opacity="0.6"/>
    <circle cx="8" cy="35" r="1.5" fill="url(#logoGradient)" opacity="0.4"/>
  </g>
  
  <!-- Company Name -->
  <text x="60" y="35" 
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" 
        font-size="24" 
        font-weight="800" 
        fill="url(#textGradient)"
        letter-spacing="-0.5px">
    Potensia
  </text>
  
  <!-- Tagline -->
  <text x="60" y="50" 
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" 
        font-size="10" 
        font-weight="500" 
        fill="#64748b"
        letter-spacing="0.5px">
    DIGITAL INNOVATION
  </text>
  
  <!-- Decorative line -->
  <line x1="60" y1="42" x2="140" y2="42" 
        stroke="url(#logoGradient)" 
        stroke-width="1" 
        opacity="0.3"/>
</svg>