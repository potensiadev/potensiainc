<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News - Potensia Inc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'fadeIn': 'fadeIn 1s ease-out',
                        'float': 'float 6s ease-in-out infinite',
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        .hero-bg {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #7c3aed 100%);
        }
        .featured-slider {
            transition: transform 0.5s ease-in-out;
        }
        .news-card {
            transition: all 0.5s ease;
        }
        .news-card:hover {
            transform: translateY(-8px);
        }
    </style>
</head>
<body class="bg-white overflow-x-hidden">
    <!-- Header -->
    <header id="header" class="fixed top-0 w-full z-50 transition-all duration-300 bg-transparent">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center">
                    <span class="text-2xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
                        Potensia
                    </span>
                </div>
                
                <!-- Desktop Menu -->
                <nav class="hidden md:flex space-x-8">
                    <a href="index.html" class="nav-link font-medium transition-colors duration-200 hover:text-blue-600 text-white">Home</a>
                    <a href="about.html" class="nav-link font-medium transition-colors duration-200 hover:text-blue-600 text-white">About</a>
                    <a href="business.html" class="nav-link font-medium transition-colors duration-200 hover:text-blue-600 text-white">Business</a>
                    <a href="news.html" class="nav-link font-medium transition-colors duration-200 hover:text-blue-600 text-blue-600 font-semibold">News</a>
                    <a href="contact.html" class="nav-link font-medium transition-colors duration-200 hover:text-blue-600 text-white">Contact</a>
                </nav>

                <!-- Mobile Menu Button -->
                <button id="mobile-menu-btn" class="md:hidden p-2">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Mobile Menu -->
        <div id="mobile-menu" class="md:hidden bg-white border-t hidden">
            <div class="px-4 py-2 space-y-1">
                <a href="index.html" class="block px-3 py-2 text-gray-900 hover:text-blue-600 transition-colors">Home</a>
                <a href="about.html" class="block px-3 py-2 text-gray-900 hover:text-blue-600 transition-colors">About</a>
                <a href="business.html" class="block px-3 py-2 text-gray-900 hover:text-blue-600 transition-colors">Business</a>
                <a href="news.html" class="block px-3 py-2 text-blue-600 font-semibold">News</a>
                <a href="contact.html" class="block px-3 py-2 text-gray-900 hover:text-blue-600 transition-colors">Contact</a>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="relative h-screen flex items-center justify-center overflow-hidden hero-bg">
        <!-- Animated Background Elements -->
        <div class="absolute inset-0">
            <div class="absolute top-1/4 left-1/4 w-64 h-64 bg-blue-500/10 rounded-full blur-3xl animate-pulse"></div>
            <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-purple-500/10 rounded-full blur-3xl animate-pulse" style="animation-delay: 1s;"></div>
        </div>

        <div class="relative z-10 text-center text-white max-w-5xl mx-auto px-4">
            <div class="space-y-8 animate-fadeIn">
                <h1 class="text-5xl md:text-7xl font-bold leading-tight">
                    <span class="block">최신</span>
                    <span class="block bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">
                        소식
                    </span>
                </h1>
                <p class="text-xl md:text-2xl text-gray-300 max-w-3xl mx-auto leading-relaxed">
                    포텐시아의 혁신적인 발걸음과 업계 동향을 가장 빠르게 전해드립니다
                </p>
                
                <!-- Quick Stats -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-6 mt-12">
                    <div class="text-center">
                        <div class="text-3xl md:text-4xl font-bold text-blue-300 mb-2">50+</div>
                        <div class="text-sm font-medium">월 평균 기사</div>
                    </div>
                    <div class="text-center">
                        <div class="text-3xl md:text-4xl font-bold text-purple-300 mb-2">10K+</div>
                        <div class="text-sm font-medium">월 독자 수</div>
                    </div>
                    <div class="text-center">
                        <div class="text-3xl md:text-4xl font-bold text-cyan-300 mb-2">24H</div>
                        <div class="text-sm font-medium">업데이트 주기</div>
                    </div>
                    <div class="text-center">
                        <div class="text-3xl md:text-4xl font-bold text-pink-300 mb-2">5</div>
                        <div class="text-sm font-medium">전문 카테고리</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Scroll Indicator -->
        <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 text-white animate-bounce">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
            </svg>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white py-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
                <div class="md:col-span-2">
                    <div class="flex items-center mb-6">
                        <div class="w-12 h-12 bg-gradient-to-r from-blue-600 to-purple-600 rounded-lg flex items-center justify-center mr-4">
                            <span class="text-white font-bold text-xl">P</span>
                        </div>
                        <span class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">
                            Potensia
                        </span>
                    </div>
                    <p class="text-gray-400 text-lg leading-relaxed mb-6">
                        포텐시아의 최신 소식과 업계 동향을 가장 빠르게 전해드립니다.
                    </p>
                </div>
            </div>
            <div class="border-t border-gray-800 mt-12 pt-8 text-center text-gray-400">
                <p>&copy; 2025 Potensia Inc. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
  
        // State
        let selectedCategory = 'all';
        let searchTerm = '';
        let featuredIndex = 0;
        const featuredCount = 3;

        // Header scroll effect
        window.addEventListener('scroll', function() {
            const header = document.getElementById('header');
            const scrollY = window.pageYOffset;
            
            if (scrollY > 50) {
                header.classList.add('bg-white/95', 'backdrop-blur-md', 'shadow-lg');
                header.classList.remove('bg-transparent');
                
                const navLinks = header.querySelectorAll('.nav-link');
                navLinks.forEach(link => {
                    if (!link.classList.contains('text-blue-600')) {
                        link.classList.remove('text-white');
                        link.classList.add('text-gray-900');
                    }
                });
            } else {
                header.classList.remove('bg-white/95', 'backdrop-blur-md', 'shadow-lg');
                header.classList.add('bg-transparent');
                
                const navLinks = header.querySelectorAll('.nav-link');
                navLinks.forEach(link => {
                    if (!link.classList.contains('text-blue-600')) {
                        link.classList.remove('text-gray-900');
                        link.classList.add('text-white');
                    }
                });
            }
        });

        // Mobile menu toggle
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        
        mobileMenuBtn.addEventListener('click', function() {
            mobileMenu.classList.toggle('hidden');
        });

        // Close mobile menu when clicking on a link
        document.querySelectorAll('#mobile-menu a').forEach(link => {
            link.addEventListener('click', function() {
                mobileMenu.classList.add('hidden');
            });
        });

        // Featured slider functionality
        function updateFeaturedSlider() {
            const slider = document.getElementById('featured-slider');
            const navButtons = document.querySelectorAll('#featured-nav button');
            
            slider.style.transform = `translateX(-${featuredIndex * 100}%)`;
            
            navButtons.forEach((button, index) => {
                if (index === featuredIndex) {
                    button.className = 'w-3 h-3 rounded-full bg-blue-600 w-8 transition-all duration-300';
                } else {
                    button.className = 'w-3 h-3 rounded-full bg-gray-300 transition-all duration-300';
                }
            });
        }

        // Featured slider navigation
        document.querySelectorAll('#featured-nav button').forEach((button, index) => {
            button.addEventListener('click', function() {
                featuredIndex = index;
                updateFeaturedSlider();
            });
        });

        // Auto-advance featured slider
        setInterval(function() {
            featuredIndex = (featuredIndex + 1) % featuredCount;
            updateFeaturedSlider();
        }, 5000);

        // Category filter functionality
        function updateCategoryButtons() {
            const buttons = document.querySelectorAll('.category-btn');
            buttons.forEach(button => {
                const category = button.dataset.category;
                if (category === selectedCategory) {
                    const categoryInfo = categories[category];
                    button.className = `category-btn flex items-center space-x-2 px-4 py-2 rounded-full font-medium transition-all duration-300 bg-gradient-to-r ${categoryInfo.color} text-white shadow-lg`;
                } else {
                    button.className = 'category-btn flex items-center space-x-2 px-4 py-2 rounded-full font-medium transition-all duration-300 bg-gray-100 text-gray-700 hover:bg-gray-200';
                }
            });
        }

        // Filter news based on category and search
        function filterNews() {
            return allNews.filter(news => {
                const matchesCategory = selectedCategory === 'all' || news.category === selectedCategory;
                const matchesSearch = news.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                   news.excerpt.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                   news.tags.some(tag => tag.toLowerCase().includes(searchTerm.toLowerCase()));
                return matchesCategory && matchesSearch;
            });
        }

        // Render news articles
        function renderNews() {
            const filteredNews = filterNews();
            const newsGrid = document.getElementById('news-grid');
            const noResults = document.getElementById('no-results');
            const loadMoreSection = document.getElementById('load-more-section');
            
            if (filteredNews.length === 0) {
                newsGrid.innerHTML = '';
                noResults.classList.remove('hidden');
                loadMoreSection.classList.add('hidden');
                return;
            }
            
            noResults.classList.add('hidden');
            loadMoreSection.classList.remove('hidden');
            
            newsGrid.innerHTML = filteredNews.map(news => `
                <article class="news-card group bg-white rounded-2xl shadow-lg hover:shadow-2xl transition-all duration-500 transform hover:-translate-y-2 border border-gray-100 overflow-hidden">
                    <div class="relative overflow-hidden">
                        <img src="${news.image}" alt="${news.title}" 
                             class="w-full h-48 object-cover group-hover:scale-110 transition-transform duration-500">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                        
                        <div class="absolute top-4 left-4">
                            <span class="px-3 py-1 bg-gradient-to-r ${categories[news.category].color} text-white text-sm font-semibold rounded-full">
                                ${news.categoryName}
                            </span>
                        </div>

                        <div class="absolute top-4 right-4 flex space-x-2 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                            <button class="p-2 bg-white/20 backdrop-blur-sm rounded-full text-white hover:bg-white/30 transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path>
                                </svg>
                            </button>
                            <button class="p-2 bg-white/20 backdrop-blur-sm rounded-full text-white hover:bg-white/30 transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="p-6 space-y-4">
                        <div class="flex items-center justify-between text-sm text-gray-500">
                            <div class="flex items-center space-x-4">
                                <div class="flex items-center space-x-1">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                                    </svg>
                                    <span>${news.date}</span>
                                </div>
                                <div class="flex items-center space-x-1">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                    </svg>
                                    <span>${news.readTime}</span>
                                </div>
                            </div>
                            <div class="flex items-center space-x-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                </svg>
                                <span>${news.views}</span>
                            </div>
                        </div>

                        <h3 class="text-xl font-bold text-gray-900 leading-tight group-hover:text-blue-600 transition-colors">
                            ${news.title}
                        </h3>

                        <p class="text-gray-600 leading-relaxed">
                            ${news.excerpt}
                        </p>

                        <div class="flex flex-wrap gap-2">
                            ${news.tags.map(tag => `<span class="px-2 py-1 bg-gray-100 text-gray-600 text-xs rounded-full">#${tag}</span>`).join('')}
                        </div>

                        <div class="flex items-center justify-between pt-4 border-t border-gray-100">
                            <div class="flex items-center space-x-2 text-sm text-gray-500">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                </svg>
                                <span>${news.author}</span>
                            </div>
                            
                            <button class="text-blue-600 font-semibold text-sm hover:text-blue-700 transition-colors flex items-center space-x-1 group/btn">
                                <span>더 읽기</span>
                                <svg class="w-4 h-4 group-hover/btn:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                </article>
            `).join('');
        }

        // Category filter event listeners
        document.querySelectorAll('.category-btn').forEach(button => {
            button.addEventListener('click', function() {
                selectedCategory = this.dataset.category;
                updateCategoryButtons();
                renderNews();
            });
        });

        // Search functionality
        document.getElementById('search-input').addEventListener('input', function() {
            searchTerm = this.value;
            renderNews();
        });

        // Newsletter subscription
        document.getElementById('newsletter-btn').addEventListener('click', function() {
            const email = document.getElementById('newsletter-email').value;
            if (email) {
                alert('뉴스레터 구독이 신청되었습니다!');
                document.getElementById('newsletter-email').value = '';
            } else {
                alert('이메일 주소를 입력해주세요.');
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            updateCategoryButtons();
            renderNews();
        });

        // Smooth scrolling for anchor links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });

        // Animate elements on scroll
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver(function(entries) {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('animate-fadeIn');
                }
            });
        }, observerOptions);

        // Observe elements for animation
        document.querySelectorAll('.news-card').forEach(el => {
            observer.observe(el);
        });

        // Loading animation
        window.addEventListener('load', function() {
            document.body.classList.add('loaded');
        });
    </script>
</body>
</html>
