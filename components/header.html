<!-- Header Enhancement Script -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  const header = document.querySelector('[data-header]');
  const mobileMenuToggle = document.querySelector('[data-mobile-menu-toggle]');
  const mobileMenu = document.querySelector('[data-mobile-menu]');
  const navLinks = document.querySelectorAll('[data-nav-link]');
  
  // Set active navigation link based on current page
  const currentPage = window.location.pathname;
  navLinks.forEach(link => {
    const href = link.getAttribute('href');
    if (href === currentPage || 
        (currentPage === '/' && href === '/') ||
        (currentPage.includes(href.replace('.html', '')) && href !== '/')) {
      link.classList.add('active');
      link.setAttribute('aria-current', 'page');
    }
  });
  
  // Mobile menu toggle functionality
  if (mobileMenuToggle && mobileMenu) {
    mobileMenuToggle.addEventListener('click', function() {
      const isOpen = mobileMenu.classList.contains('block') || !mobileMenu.classList.contains('hidden');
      
      if (isOpen) {
        // Close menu
        mobileMenu.classList.add('hidden');
        mobileMenu.classList.remove('block');
        mobileMenuToggle.setAttribute('aria-expanded', 'false');
        document.body.style.overflow = '';
        
        // Toggle icons
        mobileMenuToggle.querySelector('[data-menu-icon="open"]').classList.remove('hidden');
        mobileMenuToggle.querySelector('[data-menu-icon="close"]').classList.add('hidden');
      } else {
        // Open menu
        mobileMenu.classList.remove('hidden');
        mobileMenu.classList.add('block');
        mobileMenuToggle.setAttribute('aria-expanded', 'true');
        document.body.style.overflow = 'hidden';
        
        // Toggle icons
        mobileMenuToggle.querySelector('[data-menu-icon="open"]').classList.add('hidden');
        mobileMenuToggle.querySelector('[data-menu-icon="close"]').classList.remove('hidden');
      }
    });
    
    // Close mobile menu when clicking nav links
    const mobileNavLinks = mobileMenu.querySelectorAll('[data-nav-link]');
    mobileNavLinks.forEach(link => {
      link.addEventListener('click', function() {
        mobileMenu.classList.add('hidden');
        mobileMenu.classList.remove('block');
        mobileMenuToggle.setAttribute('aria-expanded', 'false');
        document.body.style.overflow = '';
        
        // Reset icons
        mobileMenuToggle.querySelector('[data-menu-icon="open"]').classList.remove('hidden');
        mobileMenuToggle.querySelector('[data-menu-icon="close"]').classList.add('hidden');
      });
    });
  }
  
  // Close mobile menu on window resize
  window.addEventListener('resize', function() {
    if (window.innerWidth >= 768 && mobileMenu && !mobileMenu.classList.contains('hidden')) {
      mobileMenu.classList.add('hidden');
      mobileMenu.classList.remove('block');
      mobileMenuToggle.setAttribute('aria-expanded', 'false');
      document.body.style.overflow = '';
      
      // Reset icons
      mobileMenuToggle.querySelector('[data-menu-icon="open"]').classList.remove('hidden');
      mobileMenuToggle.querySelector('[data-menu-icon="close"]').classList.add('hidden');
    }
  });
  
  // Header scroll effect
  let lastScrollY = window.scrollY;
  
  function updateHeader() {
    const currentScrollY = window.scrollY;
    
    if (currentScrollY > 50) {
      header.classList.add('scrolled');
      header.style.backgroundColor = 'rgba(255, 255, 255, 0.95)';
      header.style.backdropFilter = 'blur(10px)';
      header.style.boxShadow = '0 4px 6px -1px rgba(0, 0, 0, 0.1)';
    } else {
      header.classList.remove('scrolled');
      header.style.backgroundColor = '';
      header.style.backdropFilter = '';
      header.style.boxShadow = '';
    }
    
    lastScrollY = currentScrollY;
  }
  
  // Throttled scroll listener
  let ticking = false;
  window.addEventListener('scroll', function() {
    if (!ticking) {
      requestAnimationFrame(function() {
        updateHeader();
        ticking = false;
      });
      ticking = true;
    }
  });
  
  // Initialize header state
  updateHeader();
});
</script>

<!-- Additional Header Styles -->
<style>

/* Navigation underline animation */
.nav-link-modern span {

/* Mobile navigation item animation */

.nav-link-mobile:hover {

/* Accessibility improvements */
@media (prefers-reduced-motion: reduce) {
  .header,
  .nav-link-modern span,
  .nav-link-mobile,
  .mobile-menu-enter-active,
  .mobile-menu-exit-active {

  }
}

/* High contrast mode */
@media (prefers-contrast: high) {
  .header {
    border-bottom: 2px solid #000;
  }
  
  .nav-link-modern:hover {

    color: #fff;
  }
}

/* Focus indicators */
.nav-link-modern:focus,

}

/* Dark mode support (future enhancement) */
@media (prefers-color-scheme: dark) {

  }
}
</style>
