<!-- 
==========================================================================
POTENSIA INC. - LOADING COMPONENTS
==========================================================================
-->

<!-- Main Page Loading Screen -->
<div id="page-loader" class="fixed inset-0 bg-white z-50 flex items-center justify-center" data-page-loader>
  <div class="text-center">
    <!-- Animated Logo -->
    <div class="mb-8">
      <div class="w-20 h-20 bg-gradient-to-r from-blue-600 to-purple-600 rounded-2xl flex items-center justify-center mx-auto animate-pulse">
        <span class="text-white font-bold text-3xl">P</span>
      </div>
    </div>
    
    <!-- Loading Animation -->
    <div class="relative">
      <!-- Spinning Circle -->
      <div class="w-12 h-12 border-4 border-gray-200 border-t-blue-600 rounded-full animate-spin mx-auto mb-4"></div>
      
      <!-- Loading Text -->
      <div class="text-gray-600 font-medium">
        <span class="loading-text" data-loading-text>로딩 중</span>
        <span class="loading-dots">
          <span class="animate-bounce">.</span>
          <span class="animate-bounce" style="animation-delay: 0.1s">.</span>
          <span class="animate-bounce" style="animation-delay: 0.2s">.</span>
        </span>
      </div>
    </div>
    
    <!-- Progress Bar -->
    <div class="w-64 h-1 bg-gray-200 rounded-full mx-auto mt-6 overflow-hidden">
      <div class="h-full bg-gradient-to-r from-blue-600 to-purple-600 rounded-full transform -translate-x-full animate-progress" data-progress-bar></div>
    </div>
  </div>
</div>

<!-- Content Loading Skeleton -->
<div class="content-skeleton hidden" data-content-skeleton>
  <!-- Header Skeleton -->
  <div class="animate-pulse">
    <div class="h-4 bg-gray-200 rounded w-3/4 mb-4"></div>
    <div class="h-4 bg-gray-200 rounded w-1/2 mb-4"></div>
    <div class="h-4 bg-gray-200 rounded w-2/3 mb-6"></div>
  </div>
  
  <!-- Card Skeletons -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <div class="animate-pulse" v-for="i in 3" :key="i">
      <div class="bg-gray-200 h-48 rounded-lg mb-4"></div>
      <div class="h-4 bg-gray-200 rounded w-3/4 mb-2"></div>
      <div class="h-4 bg-gray-200 rounded w-1/2"></div>
    </div>
  </div>
</div>

<!-- Inline Loading Spinner -->
<div class="inline-loader hidden" data-inline-loader>
  <div class="flex items-center space-x-2">
    <div class="w-4 h-4 border-2 border-gray-300 border-t-blue-600 rounded-full animate-spin"></div>
    <span class="text-gray-600 text-sm">처리 중...</span>
  </div>
</div>

<!-- Button Loading State -->
<div class="button-loader hidden" data-button-loader>
  <div class="flex items-center space-x-2">
    <div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
    <span>전송 중...</span>
  </div>
</div>

<!-- Overlay Loading -->
<div class="overlay-loader fixed inset-0 bg-black bg-opacity-50 z-40 hidden items-center justify-center" data-overlay-loader>
  <div class="bg-white rounded-lg p-8 max-w-sm mx-4 text-center">
    <!-- Large Spinner -->
    <div class="w-16 h-16 border-4 border-gray-200 border-t-blue-600 rounded-full animate-spin mx-auto mb-4"></div>
    
    <!-- Loading Message -->
    <h3 class="text-lg font-semibold text-gray-900 mb-2" data-overlay-title>처리 중입니다</h3>
    <p class="text-gray-600" data-overlay-message>잠시만 기다려주세요...</p>
    
    <!-- Cancel Button (Optional) -->
    <button class="mt-4 px-4 py-2 text-gray-500 hover:text-gray-700 text-sm" 
            data-overlay-cancel
            style="display: none;">
      취소
    </button>
  </div>
</div>

<!-- Lazy Loading Image Placeholder -->
<div class="image-placeholder bg-gray-200 animate-pulse rounded-lg flex items-center justify-center" data-image-placeholder>
  <div class="text-gray-400">
    <svg class="w-12 h-12" fill="currentColor" viewBox="0 0 20 20">
      <path fill-rule="evenodd" d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z" clip-rule="evenodd"></path>
    </svg>
  </div>
</div>

<!-- Loading States JavaScript -->
<script>
class LoadingManager {
  constructor() {
    this.pageLoader = document.querySelector('[data-page-loader]');
    this.overlayLoader = document.querySelector('[data-overlay-loader]');
    this.progressBar = document.querySelector('[data-progress-bar]');
    this.loadingTexts = [
      '로딩 중',
      '데이터 준비 중',
      '연결 중',
      '거의 완료',
      '마무리 중'
    ];
    this.currentTextIndex = 0;
    this.progressValue = 0;
    
    this.init();
  }
  
  init() {
    // Auto-hide page loader when window loads
    window.addEventListener('load', () => {
      setTimeout(() => {
        this.hidePageLoader();
      }, 500);
    });
    
    // Simulate loading progress
    if (this.pageLoader && !this.pageLoader.classList.contains('hidden')) {
      this.startLoadingAnimation();
    }
  }
  
  startLoadingAnimation() {
    // Animate loading text
    const loadingTextElement = document.querySelector('[data-loading-text]');
    if (loadingTextElement) {
      const textInterval = setInterval(() => {
        this.currentTextIndex = (this.currentTextIndex + 1) % this.loadingTexts.length;
        loadingTextElement.textContent = this.loadingTexts[this.currentTextIndex];
      }, 1000);
      
      // Clear interval when loading is done
      setTimeout(() => {
        clearInterval(textInterval);
      }, 5000);
    }
    
    // Animate progress bar
    if (this.progressBar) {
      const progressInterval = setInterval(() => {
        this.progressValue += Math.random() * 20;
        if (this.progressValue >= 100) {
          this.progressValue = 100;
          clearInterval(progressInterval);
        }
        this.updateProgress(this.progressValue);
      }, 200);
    }
  }
  
  updateProgress(value) {
    if (this.progressBar) {
      const percentage = Math.min(value, 100);
      this.progressBar.style.transform = `translateX(${percentage - 100}%)`;
    }
  }
  
  showPageLoader() {
    if (this.pageLoader) {
      this.pageLoader.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }
  }
  
  hidePageLoader() {
    if (this.pageLoader) {
      this.pageLoader.style.opacity = '0';
      setTimeout(() => {
        this.pageLoader.classList.add('hidden');
        document.body.style.overflow = '';
      }, 300);
    }
  }
  
  showOverlayLoader(title = '처리 중입니다', message = '잠시만 기다려주세요...', showCancel = false) {
    if (this.overlayLoader) {
      const titleElement = this.overlayLoader.querySelector('[data-overlay-title]');
      const messageElement = this.overlayLoader.querySelector('[data-overlay-message]');
      const cancelButton = this.overlayLoader.querySelector('[data-overlay-cancel]');
      
      if (titleElement) titleElement.textContent = title;
      if (messageElement) messageElement.textContent = message;
      if (cancelButton) {
        cancelButton.style.display = showCancel ? 'block' : 'none';
      }
      
      this.overlayLoader.classList.remove('hidden');
      this.overlayLoader.classList.add('flex');
      document.body.style.overflow = 'hidden';
    }
  }
  
  hideOverlayLoader() {
    if (this.overlayLoader) {
      this.overlayLoader.classList.add('hidden');
      this.overlayLoader.classList.remove('flex');
      document.body.style.overflow = '';
    }
  }
  
  showInlineLoader(container) {
    const loader = document.querySelector('[data-inline-loader]').cloneNode(true);
    loader.classList.remove('hidden');
    loader.removeAttribute('data-inline-loader');
    
    if (container) {
      container.appendChild(loader);
    }
    
    return loader;
  }
  
  hideInlineLoader(loader) {
    if (loader && loader.parentNode) {
      loader.parentNode.removeChild(loader);
    }
  }
  
  showButtonLoader(button, text = '처리 중...') {
    if (!button) return;
    
    const originalContent = button.innerHTML;
    button.disabled = true;
    button.dataset.originalContent = originalContent;
    
    button.innerHTML = `
      <div class="flex items-center space-x-2">
        <div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
        <span>${text}</span>
      </div>
    `;
    
    return originalContent;
  }
  
  hideButtonLoader(button) {
    if (!button) return;
    
    button.disabled = false;
    const originalContent = button.dataset.originalContent;
    if (originalContent) {
      button.innerHTML = originalContent;
      delete button.dataset.originalContent;
    }
  }
  
  showContentSkeleton(container) {
    const skeleton = document.querySelector('[data-content-skeleton]').cloneNode(true);
    skeleton.classList.remove('hidden');
    skeleton.removeAttribute('data-content-skeleton');
    
    if (container) {
      container.innerHTML = '';
      container.appendChild(skeleton);
    }
    
    return skeleton;
  }
  
  hideContentSkeleton(container) {
    if (container) {
      const skeleton = container.querySelector('.content-skeleton');
      if (skeleton) {
        skeleton.remove();
      }
    }
  }
  
  // Lazy loading image with placeholder
  setupLazyImage(img) {
    const placeholder = document.querySelector('[data-image-placeholder]').cloneNode(true);
    placeholder.classList.remove('hidden');
    placeholder.style.width = img.offsetWidth + 'px';
    placeholder.style.height = img.offsetHeight + 'px';
    
    // Insert placeholder
    img.parentNode.insertBefore(placeholder, img);
    img.style.display = 'none';
    
    // Load image
    const tempImg = new Image();
    tempImg.onload = () => {
      img.style.display = 'block';
      img.style.opacity = '0';
      img.style.transition = 'opacity 0.3s ease';
      
      setTimeout(() => {
        img.style.opacity = '1';
        placeholder.remove();
      }, 100);
    };
    
    tempImg.onerror = () => {
      placeholder.innerHTML = `
        <div class="text-red-400">
          <svg class="w-12 h-12" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
          </svg>
        </div>
      `;
    };
    
    tempImg.src = img.src;
  }
  
  // Form loading state
  showFormLoader(form) {
    const inputs = form.querySelectorAll('input, textarea, select, button');
    inputs.forEach(input => {
      input.disabled = true;
    });
    
    const submitButton = form.querySelector('[type="submit"]');
    if (submitButton) {
      this.showButtonLoader(submitButton);
    }
    
    // Add loading overlay to form
    const overlay = document.createElement('div');
    overlay.className = 'absolute inset-0 bg-white bg-opacity-75 flex items-center justify-center';
    overlay.innerHTML = `
      <div class="flex items-center space-x-2">
        <div class="w-6 h-6 border-2 border-gray-300 border-t-blue-600 rounded-full animate-spin"></div>
        <span class="text-gray-600">처리 중...</span>
      </div>
    `;
    
    form.style.position = 'relative';
    form.appendChild(overlay);
    
    return overlay;
  }
  
  hideFormLoader(form, overlay) {
    const inputs = form.querySelectorAll('input, textarea, select, button');
    inputs.forEach(input => {
      input.disabled = false;
    });
    
    const submitButton = form.querySelector('[type="submit"]');
    if (submitButton) {
      this.hideButtonLoader(submitButton);
    }
    
    if (overlay && overlay.parentNode) {
      overlay.parentNode.removeChild(overlay);
    }
  }
}

// Initialize loading manager
const loadingManager = new LoadingManager();

// Global loading functions
window.showPageLoader = () => loadingManager.showPageLoader();
window.hidePageLoader = () => loadingManager.hidePageLoader();
window.showOverlayLoader = (title, message, showCancel) => loadingManager.showOverlayLoader(title, message, showCancel);
window.hideOverlayLoader = () => loadingManager.hideOverlayLoader();
window.showButtonLoader = (button, text) => loadingManager.showButtonLoader(button, text);
window.hideButtonLoader = (button) => loadingManager.hideButtonLoader(button);
window.showContentSkeleton = (container) => loadingManager.showContentSkeleton(container);
window.hideContentSkeleton = (container) => loadingManager.hideContentSkeleton(container);

// Export for module usage
if (typeof module !== 'undefined' && module.exports) {
  module.exports = LoadingManager;
}
</script>

<!-- Loading Animation Styles -->
<style>
/* Page loader animations */
@keyframes progress {
  0% {
    transform: translateX(-100%);
  }
  100% {
    transform: translateX(0%);
  }
}

.animate-progress {
  animation: progress 3s ease-in-out infinite;
}

/* Skeleton loading animation */
@keyframes skeleton {
  0% {
    background-position: -200px 0;
  }
  100% {
    background-position: calc(200px + 100%) 0;
  }
}

.content-skeleton .animate-pulse {
  background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
  background-size: 200px 100%;
  animation: skeleton 1.5s infinite;
}

/* Loading dots animation */
.loading-dots span {
  animation-duration: 1.4s;
  animation-iteration-count: infinite;
  animation-timing-function: ease-in-out;
}

/* Spinner variations */
.spinner-border {
  width: 2rem;
  height: 2rem;
  border: 0.25em solid currentColor;
  border-right-color: transparent;
  border-radius: 50%;
  animation: spin 0.75s linear infinite;
}

.spinner-grow {
  width: 2rem;
  height: 2rem;
  background-color: currentColor;
  border-radius: 50%;
  opacity: 0;
  animation: grow 0.75s linear infinite;
}

@keyframes grow {
  0% {
    transform: scale(0);
    opacity: 1;
  }
  100% {
    transform: scale(1);
    opacity: 0;
  }
}

/* Pulse loading effect */
.pulse-loader {
  display: inline-block;
  width: 40px;
  height: 40px;
  background-color: #3b82f6;
  border-radius: 100%;
  animation: pulse-scale 1.0s infinite ease-in-out;
}

@keyframes pulse-scale {
  0% {
    transform: scale(0);
  }
  100% {
    transform: scale(1.0);
    opacity: 0;
  }
}

/* Wave loading effect */
.wave-loader {
  display: inline-block;
  width: 40px;
  height: 40px;
  margin: 0 5px;
}

.wave-loader .wave {
  display: inline-block;
  width: 6px;
  height: 40px;
  background-color: #3b82f6;
  margin: 0 1px;
  animation: wave-scale 1.2s infinite ease-in-out;
}

.wave-loader .wave:nth-child(2) { animation-delay: -1.1s; }
.wave-loader .wave:nth-child(3) { animation-delay: -1.0s; }
.wave-loader .wave:nth-child(4) { animation-delay: -0.9s; }
.wave-loader .wave:nth-child(5) { animation-delay: -0.8s; }

@keyframes wave-scale {
  0%, 40%, 100% {
    transform: scaleY(0.4);
  }
  20% {
    transform: scaleY(1.0);
  }
}

/* Overlay loader backdrop */
.overlay-loader {
  backdrop-filter: blur(2px);
}

/* Button loader state */
button:disabled {
  cursor: not-allowed;
  opacity: 0.6;
}

button:disabled .animate-spin {
  animation: spin 1s linear infinite;
}

/* Image placeholder */
.image-placeholder {
  background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
  background-size: 200px 100%;
  animation: skeleton 1.5s infinite;
}

/* Reduced motion support */
@media (prefers-reduced-motion: reduce) {
  .animate-spin,
  .animate-pulse,
  .animate-bounce,
  .animate-progress,
  .loading-dots span,
  .pulse-loader,
  .wave-loader .wave {
    animation: none;
  }
  
  .content-skeleton .animate-pulse,
  .image-placeholder {
    animation: none;
    background: #e5e7eb;
  }
}

/* High contrast mode */
@media (prefers-contrast: high) {
  .bg-gray-200 {
    background-color: #9ca3af;
  }
  
  .border-gray-200 {
    border-color: #6b7280;
  }
}

/* Dark mode support */
@media (prefers-color-scheme: dark) {
  #page-loader {
    background-color: #111827;
    color: #f9fafb;
  }
  
  .overlay-loader > div {
    background-color: #1f2937;
    color: #f9fafb;
  }
  
  .content-skeleton .animate-pulse {
    background: linear-gradient(90deg, #374151 25%, #4b5563 50%, #374151 75%);
  }
}
</style>
